name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.changes.outputs.core }}
      gradle: ${{ steps.changes.outputs.gradle }}
      ide: ${{ steps.changes.outputs.ide }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - name: Validate selection outputs
        env:
          CORE_FILTER: ${{ steps.changes.outputs.core }}
          GRADLE_FILTER: ${{ steps.changes.outputs.gradle }}
          IDE_FILTER: ${{ steps.changes.outputs.ide }}
        run: >-
          jq -en --arg core "$CORE_FILTER" --arg gradle "$GRADLE_FILTER" --arg ide "$IDE_FILTER"
          '[$core, $gradle, $ide] | all(. == "true" or . == "false")'
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"
          pyflakes: false

  core:
    name: Core contracts (Java 21)
    needs: [quality]
    if: needs.quality.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test the model, engine, and default Gradle adapter
        run: ./gradlew :model:test :agent:test :engine:test :cli:test :gradle-plugin:test --stacktrace

  runtime:
    name: Runtime (${{ matrix.os }}, Java ${{ matrix.java }})
    needs: [quality]
    if: needs.quality.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21, 25, 26]
        exclude:
          - os: ubuntu-latest
            java: 21
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test instrumentation and native workers
        run: ./gradlew :agent:test :engine:test :cli:test --stacktrace
      - name: Test the Gradle adapter on each native host
        if: matrix.java == 21
        run: ./gradlew :gradle-plugin:test --stacktrace

  gradle-compatibility:
    name: Gradle ${{ matrix.gradle }} compatibility
    needs: [quality]
    if: needs.quality.outputs.gradle == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gradle: ["8.5", "8.14.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test the adapter with the selected Gradle version
        run: ./gradlew :gradle-plugin:test -PfunctionalGradleVersion=${{ matrix.gradle }} --stacktrace

  intellij:
    name: IntelliJ plugin verification
    needs: [quality]
    if: needs.quality.outputs.ide == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and verify supported IDE versions
        run: ./gradlew :intellij-plugin:buildPlugin :intellij-plugin:verifyPlugin --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intellij-plugin
          path: intellij-plugin/build/distributions/*.zip

  required:
    name: required
    if: always()
    needs: [quality, core, runtime, gradle-compatibility, intellij]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check every selected result
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "$RESULTS"
