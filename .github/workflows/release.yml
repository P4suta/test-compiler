name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.1.0)
        required: true
        type: string
      confirmation:
        description: Type RELEASE to publish all registries
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirmation == 'RELEASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Validate release tag and project version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          PROJECT_VERSION="$(./gradlew properties -q | sed -n 's/^version: //p' | head -n 1)"
          test "$RELEASE_TAG" = "v$PROJECT_VERSION"
      - name: Verify publication inputs
        run: ./gradlew :model:test :agent:test :engine:test :cli:test :gradle-plugin:test :intellij-plugin:verifyPlugin build
      - name: Publish Maven Central and Gradle Plugin Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishAllPublicationsToCentralPortalRepository :gradle-plugin:publishPlugins
      - name: Publish JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
        run: ./gradlew :intellij-plugin:signPlugin :intellij-plugin:publishPlugin
      - name: Build release archives
        run: ./gradlew :cli:distZip :intellij-plugin:buildPlugin
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            cli/build/distributions/*.zip
            intellij-plugin/build/distributions/*.zip
            model/build/libs/*.jar
            agent/build/libs/*-all.jar
            engine/build/libs/*-all.jar
